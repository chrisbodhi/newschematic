baseurl = "https://newschematic.org/"
title = "New Schematic"
languageCode = "en-us"
theme = "newschematic"
footnoteReturnLinkContents = "↩"
enableEmoji = true

author = "Christopher Boette"
copyright = "Christopher Boette, CC by-sa-nc"
enableRobotsTXT = true

[params]
  author = "Christopher Boette"
  intro = "Software Engineer, with a focus on Web"
  authorImage = "me.jpg"
  description = "Like the smell of rain on a summer day: coding"
  dateFormat = "Jan 2, 2006"
  defaultTheme = "auto"
  math = false # Set to true in front matter for rendering with MathJax

[params.blyg]
  # The Blygger conformance level (blygger-spec protocol-v0.2 §3) this
  # deployment actually serves -- feeds blyg.json's "level" field
  # (modules/hugo-blyg/layouts/blyg/section.blygmanifest.json).
  # Level 1 is everything this module currently builds: stable ids,
  # versioned items, the manifest/feed/archive-index/item-document
  # surfaces, withdrawal, pins. Keep this at 1 until L2 constructs (the
  # blogroll, generation provenance disclosure, ...) are actually built
  # -- bumping it without shipping those would be a false conformance
  # claim on the wire, and the build refuses anything else.
  level = 1

[params.profileMode]
  enabled = true
  title = "Christopher Boette"
  subtitle = "Software Engineer, with a focus on Web\n\n_Like the smell of rain on a summer day: coding_"
  imageUrl = "img/me.jpg"
  imageTitle = "Christopher Boette, by Larry Suarez"
  imageWidth = 120
  imageHeight = 120

[[params.socialIcons]]
   name = "GitHub"
   url = "https://github.com/chrisbodhi"
[[params.socialIcons]]
   name = "LinkedIn"
   url = "https://www.linkedin.com/in/chrisboette/"
[[params.socialIcons]]
   name = "Substack"
   url = "https://chrisbodhi.substack.com/profile/posts"
[[params.socialIcons]]
