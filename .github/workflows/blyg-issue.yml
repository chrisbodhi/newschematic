# Publishes a blyg fragment from an issue labeled `blyg`, via the
# hugo-blyg module's publish-from-issue action (see its action.yml for the
# inputs). It opens a PR that closes the issue on merge; that merge's push
# runs deploy.yml, which builds and validates the site before shipping it.
#
# Needs "Allow GitHub Actions to create and approve pull requests" enabled
# under Settings -> Actions -> General -> Workflow permissions.
name: Publish blyg from issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Filing an issue with the label already set fires both `opened` and
# `labeled`; queue them per issue so the second sees the first's branch.
concurrency:
  group: blyg-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish blyg fragment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./modules/hugo-blyg/publish-from-issue
        # with:
        #   authors: someone, someone-else   # besides the repo owner
