on:
  push:
    branches-ignore:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache # <- Define the env variable here, so that Hugo's cache dir is now predictible in your workflow and doesn't depend on the Hugo's version you're using.
      HUGO_ENV: production

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The blyg scripts ship inside the hugo-blyg module: run the copy at
      # the version go.mod pins, the same one the templates come from.
      - name: Locate hugo-blyg
        run: |
          go mod download github.com/chrisbodhi/hugo-blyg
          echo "BLYG=$(go list -m -f '{{.Dir}}' github.com/chrisbodhi/hugo-blyg)" >> "$GITHUB_ENV"

      - name: Check blyg content is stamped
        run: python3 "$BLYG/scripts/blyg_stamp.py" --check

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.151.0"
          extended: true

      - uses: actions/cache@v4
        with:
          path: ${{ env.HUGO_CACHEDIR }} # <- Use the same env variable just right here
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-


      - name: Generate site
        run: hugo --minify

      - name: Validate blyg surface
        run: python3 "$BLYG/scripts/blyg_validate.py"
