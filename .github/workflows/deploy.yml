on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to DH
    runs-on: ubuntu-latest
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache # <- Define the env variable here, so that Hugo's cache dir is now predictible in your workflow and doesn't depend on the Hugo's version you're using.
      HUGO_ENV: production
    steps:
      - uses: actions/checkout@v5

      # Via https://github.com/zellwk/zellwk.com/blob/master/.github/workflows/deploy.yml
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "placeholder-per-zellwk-dot-com"
      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.DH_HOST }} >> ~/.ssh/known_hosts

      # The same blyg gates as build.yml: this workflow is what actually
      # ships, so an unstamped push straight to master must fail here too
      # rather than deploy a same-version stealth edit (§13.3).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The blyg scripts ship inside the hugo-blyg module: run the copy at
      # the version go.mod pins, the same one the templates come from.
      - name: Locate hugo-blyg
        run: |
          go mod download github.com/chrisbodhi/hugo-blyg
          echo "BLYG=$(go list -m -f '{{.Dir}}' github.com/chrisbodhi/hugo-blyg)" >> "$GITHUB_ENV"

      - name: Check blyg content is stamped
        run: python3 "$BLYG/scripts/blyg_stamp.py" --check

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.151.0"
          extended: true

      - uses: actions/cache@v4
        with:
          path: ${{ env.HUGO_CACHEDIR }} # <- Use the same env variable just right here
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-


      - name: Generate site
        run: hugo --minify

      - name: Validate blyg surface
        run: python3 "$BLYG/scripts/blyg_validate.py"

      - name: Deploy
        env:
          DH_USER: ${{ secrets.DH_USER }}
          DH_HOST: ${{ secrets.DH_HOST }}
        run: rsync -vz -e "$(which ssh)" --bwlimit=2000 -av public/ "$DH_USER"@"$DH_HOST":newschematic.org
